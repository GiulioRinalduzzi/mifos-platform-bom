name: Publish Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - run: chmod +x ./gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify BOM
        run: ./gradlew :bom-verification:verifyBom

      - name: Check version is SNAPSHOT
        run: |
          version=$(grep -E "^version\s*=\s*'" build.gradle | sed "s/version\s*=\s*'//;s/'//")
          if [[ -z "$version" ]]; then
            version=$(grep -E 'version\s*=\s*' build.gradle | head -1 | sed "s/.*version\s*=\s*['\"]//;s/['\"].*//")
          fi
          echo "Detected version: $version"
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "ERROR: publish-snapshot.yml only publishes SNAPSHOT versions; current version is $version — use the release workflow."
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishMavenBomPublicationToGitHubPackagesRepository
