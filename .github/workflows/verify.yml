name: Verify BOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: chmod +x ./gradlew

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run verifyBom
        run: ./gradlew :bom-verification:verifyBom --stacktrace

      - name: Full build (compile + test)
        run: ./gradlew build
