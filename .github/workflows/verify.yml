name: Verify BOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: chmod +x ./gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Diagnose arg passing
        run: |
          echo "---- env ----"
          env | grep -iE 'gradle|develocity|java' | sort
          echo "---- argv echo via printf ----"
          printf '<%s>\n' :bom-verification:verifyBom --stacktrace
          echo "---- gradle tasks list ----"
          ./gradlew :bom-verification:tasks --all 2>&1 | grep -iE 'verify|bom' || true
          echo "---- direct invoke without --stacktrace ----"
          ./gradlew :bom-verification:verifyBom || echo "EXIT=$?"
          echo "---- direct invoke with -S long form ----"
          ./gradlew :bom-verification:verifyBom -S || echo "EXIT=$?"

      - name: Run verifyBom
        run: ./gradlew :bom-verification:verifyBom --stacktrace

      - name: Full build (compile + test)
        run: ./gradlew build
